<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>aaa-hub admin</title>
<style>
body{font:14px system-ui,sans-serif;margin:0;background:#fafafa;color:#222}
header{padding:8px 16px;background:#222;color:#fff;display:flex;gap:12px;align-items:center}
nav button{background:transparent;color:#fff;border:0;cursor:pointer;padding:4px 8px;font:inherit}
nav button.active{border-bottom:2px solid #fff}
main{padding:16px}
table{border-collapse:collapse;width:100%}
td,th{border-bottom:1px solid #ddd;padding:6px 8px;vertical-align:top;text-align:left}
.status-new{color:#0a7}
.status-resolved{color:#888}
.status-wontfix{color:#888}
textarea,input,select{font:inherit}
section{max-width:1080px}
pre{background:#f0f0f0;padding:8px;border-radius:4px;white-space:pre-wrap}
</style>
</head>
<body>
<header>
  <strong>aaa-hub</strong>
  <nav>
    <button id="tab-fb" class="active">Feedback</button>
    <button id="tab-rel">Releases</button>
  </nav>
  <span style="margin-left:auto"><input id="token" placeholder="admin token" size="32"/></span>
</header>
<main>
  <section id="view-fb">
    <p>
      <button id="reload">Reload</button>
      <select id="filter">
        <option value="">all</option>
        <option>new</option><option>triaged</option><option>in_progress</option>
        <option>resolved</option><option>wontfix</option>
      </select>
    </p>
    <table id="fb-table">
      <thead><tr><th>Time</th><th>Status</th><th>Cat</th><th>Title</th><th>Version</th><th>OS</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
  </section>
  <section id="view-rel" hidden>
    <h3>Publish a release</h3>
    <form id="rel-form">
      <p>Version (semver): <input name="version" required/></p>
      <p>Artifact: <input type="file" name="artifact" required/></p>
      <p>Signature (.sig): <input type="file" name="signature" required/></p>
      <button>Upload</button>
    </form>
    <pre id="rel-out"></pre>
  </section>
</main>
<script src="/admin/admin.js"></script>
</body>
</html>
