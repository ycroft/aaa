[package]
name = "aaa-hub"
version = "0.2.3"
edition = "2021"

[[bin]]
name = "aaa-hub"
path = "src/main.rs"

[lib]
name = "aaa_hub"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.7", features = ["multipart", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "fs", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "macros", "migrate", "time"] }
anyhow = "1"
thiserror = "2"
ulid = { version = "1", features = ["serde"] }
time = { version = "0.3", features = ["serde", "formatting"] }
figment = { version = "0.10", features = ["toml", "env"] }
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
governor = "0.7"
mime_guess = "2"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
semver = "1"
async-trait = "0.1"
aaa-wire = { path = "../wire" }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart"] }
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
